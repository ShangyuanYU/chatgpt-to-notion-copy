<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT to Notion Math</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Notion 连接设置</h1>
    <label>Internal Integration Token
      <input id="token" type="password" autocomplete="off" placeholder="ntn_… 或 secret_…">
    </label>
    <button id="save" type="button">保存设置</button>
    <p id="status" role="status"></p>
    <details>
      <summary>配置方法</summary>
      <ol>
        <li>在 Notion Developer 创建 Internal Integration，并复制 Token。</li>
        <li>打开目标页面，通过“连接”把该 Integration 加入页面。</li>
        <li>只需保存 Token，不需要填写固定页面。</li>
        <li>重载扩展后刷新 ChatGPT 和 Notion 页面。</li>
      </ol>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
